name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Test & Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # RT5: build da imagem roda SEMPRE (sem depender de secrets); push/deploy é o job cd.
      - name: Build Docker image
        run: docker build -t hackatonfiap-front:${{ github.sha }} -f Dockerfile .

  cd:
    name: Deploy to Azure Container Apps (opcional)
    runs-on: ubuntu-latest
    needs: ci
    # Gated: só em push na main COM a variável DEPLOY_TO_ACA=true.
    # Mantém a CI verde sem infra/secrets Azure (padrão RT5).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_ACA == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & push image (docker no runner; NAO az acr build — ACR Tasks e bloqueado no Free Trial)
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/hackatonfiap-front
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -f Dockerfile .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # Só troca a imagem; as env vars (UPSTREAM_MODE=apim, APIM_BASE_URL) já foram
      # setadas no provisionamento (iac/frontend.bicep) e são preservadas.
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ca-conexao-front \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/hackatonfiap-front:${{ github.sha }}
